#####################################################################
#	Homing and Gantry Adjustment Routines
#####################################################################

[idle_timeout]
timeout: 1800


# Used homing_override instead, to move toolhead AFTER homing on Z ENDSTOP
#[safe_z_home]
##	XY Location of the Z Endstop Switch
##	Update -10,-10 to the XY coordinates of your endstop pin 
##	(such as 157,305) after going through Z Endstop Pin
##	Location Definition step.
#home_xy_position:183,250
#speed:100
#z_hop:10

[homing_override]
axes: xyz                 # this setting is not working, override is always called no matter the axes
set_position_z : 0      # Define current position as Z=0 before homing
gcode:
    #SET_SKEW CLEAR=1 # Clear any skew compensation to avoid move out of range

    {% if params.Z is defined and params.Y is not defined and params.X is not defined %}    # Home only Z if it's the only param, otherwise X and Y have to be homed too
        {% set homexy = false %}
    {% else %}
        {% set homexy = true %}
    {% endif %}

    {% if params.X is not defined and params.Y is not defined %}    # Home only Z if it's the only param, otherwise X and Y have to be homed too

        G90
        G0 Z10 F600             # Moves up nozzle to a safe position
    {% endif %}

    {% if homexy is true %}     # Do we need to home X and Y first ?
        {% if params.X is defined and params.Y is not defined %}    # Home only Z if it's the only param, otherwise X and Y have to be homed too
            {% if 'y' not in printer.toolhead.homed_axes or printer.toolhead.position.y != 255 %}    # Home only Z if it's the only param, otherwise X and Y have to be homed too
                { action_raise_error("Please home Y first !") }
                M117 Please dock probe first!
            {% else %}                

                G28 X0                

            {% endif %}
        {% endif %}
        {% if params.Y is defined and params.X is not defined %}    # Home only Z if it's the only param, otherwise X and Y have to be homed too

            G28 Y0
            #G0  Y250 F6000  # prevent binding with Z chain when homing X
        {% endif %}
        {% if params.Y is not defined and params.X is not defined and params.Z is not defined %}

            G28 Y0
            #G0  Y250 F6000  # prevent binding with Z chain when homing X
            G28 X0

        {% endif %}
    {% endif %}

    {% if params.X is not defined and params.Y is not defined %}    # Home only Z if it's the only param, otherwise X and Y have to be homed too
        G90
        #G0 Z10 F600             # Moves up nozzle to a safe position

        #G0 X222 Y255 F3000      # Position above the Z Endstop
        G0 X125 Y127 F6000      # OptoTAP : Move to center before Z homing
        G28 Z0                  # Home Z
        G0 Z20 F600      # moves away the nozzle to avoid smashing the Z endstop with z_endstop_calibrate or probe_calibrate
    {% if params.NOSAFE is not defined %}    
        G0 X245 Y245 Z20 F6000      # moves away the nozzle to avoid smashing the Z endstop with z_endstop_calibrate or probe_calibrate
        #G0 X125 Z20 F3000      # moves away the nozzle to avoid smashing the Z endstop with z_endstop_calibrate or probe_calibrate
        #G0 X240 Z20 F3000      # moves away the nozzle to avoid smashing the Z endstop with z_endstop_calibrate or probe_calibrate
    {% endif %}
    {% endif %}


   
[quad_gantry_level]
##	Use QUAD_GANTRY_LEVEL to level a gantry.
##	Min & Max gantry corners - measure from nozzle at MIN (0,0) and 
##	MAX (250, 250), (300,300), or (350,350) depending on your printer size
##	to respective belt positions

#--------------------------------------------------------------------
##	Gantry Corners for 250mm Build
##	Uncomment for 250mm build
gantry_corners:
	-60,-10
	310, 320
##	Probe points
points:
	225,225
	225,25
	25,25
	25,225
#--------------------------------------------------------------------
speed: 300
horizontal_move_z: 8
retries: 6
retry_tolerance: 0.01 #0.0075
max_adjust: 10


