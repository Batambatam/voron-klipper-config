#####################################################################
#	Macros
#####################################################################
[gcode_macro PRINT_START]
#   Use PRINT_START for the slicer starting script - please customise for your slicer of choice
gcode:
    #{% set probe_attached = printer["gcode_macro _Probe_Variables"].probe_attached %}
    #{% if probe_attached %}
    #    { action_raise_error("Please dock your probe first !") }
    #    M117 Please dock probe first!
    #{% endif %}

    #{% set FL_SIZE = params.SIZE|default("0_0_0_0")|string %}
    #G32                            ; home all axes
    # Parameters
    {% set BED_TEMP = params.BED|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER|float %}

    M190 S{BED_TEMP}        ; set and wait for bed to reach temp
    M109 S150               ; set HE temp for homing and wait for hot end to reach temp

    #G91 E0                          ; set relative coordinates
    #G1 E-15.0 F3600                 ; retract filament
    #{% if "xyz" not in printer.toolhead.homed_axes %} # Only home all axes if it's not done yet
        G90                         ; set absolute coordinates
        G28 #Y0 X0 Z0            ; home all axes 
    #{% endif %}                            ; absolute coordinates
    clean_nozzle        ; Call clean nozzle macro 
     #G28 Z0 NOSAFE                   ; Home Z with clean Nozzle
    {% if printer.quad_gantry_level.applied == False %}
    QUAD_GANTRY_LEVEL               ; QGL without docking afterwards to let Adaptive bed mesh
    {% endif %}
    G28 Z0 NOSAFE                   ; rehome Z after QGL
    #G90                             ; set absolute coordinates
    #G28 Y0 X0 Z0                            ; home all axes 
    clean_nozzle                    ; Call clean nozzle macro                             ; absolute coordinates

    BED_MESH_CALIBRATE ADAPTIVE=1   ; integrated adaptive Mesh (deactivate Fryx ADAPTIVE_BED_MESH SIZE={FL_SIZE})
    G28 Z0 NOSAFE                   ; rehome Z after QGL
    G1 X20 Y255 F10000              ; Position toolhead over bucket for oozing after heating
    M109 S{EXTRUDER_TEMP}           ; set HE printing temperature and wait for hot end to reach temp
    G91 E0                          ; set relative coordinates
    G1 E10 F3600                    ; de-retract filament
    G90                             ; set absolute coordinates
    clean_nozzle
    CASE_LIGHT_ON DURATION=120      ; Turn on Case light
    #UPDATE_DELAYED_GCODE ID=TIMER_CASE_LIGHT_OFF DURATION=180          ; Waits for a few minutes before turning off case light
    #SKEW_PROFILE LOAD=my_skew_profile   ; load Skew profile (Calistar)


[gcode_macro PRINT_END]
#   Use PRINT_END for the slicer ending script - please customise for your slicer of choice
gcode:
    M400                           ; wait for buffer to clear
    G92 E0                         ; zero the extruder
    G1 E-10.0 F3600                 ; retract filament
    G91                            ; relative positioning
    #SET_SKEW CLEAR=1
    G0 Z1.00 X20.0 Y20.0 F20000    ; move nozzle to remove stringing
    TURN_OFF_HEATERS
    M107                           ; turn off fan
    G1 Z2 F3000                    ; move nozzle up 2mm
    G90                            ; absolute positioning
    G0 X250 Y250 F6000            ; park nozzle at rear
    BED_MESH_CLEAR
    ;SET_FAN_SPEED FAN=exhaust_fan SPEED=1  ;is handled in slicer


